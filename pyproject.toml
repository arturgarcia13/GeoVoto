[tool.poetry]
name = "geovoto"
version = "0.1.0"
description = "Sistema de Inteligência Geográfica Eleitoral"
authors = ["GeoVoto Team <dev@geovoto.com>"]
readme = "README.md"
packages = [{include = "geovoto", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4"
streamlit = "^1.30.0"
pandas = "^2.0.0"
geopandas = "^0.14.0"
plotly = "^5.18.0"
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.1.0"
pydeck = "^0.8.0"
shapely = "^2.0.0"
openpyxl = "^3.1.0"
psycopg2-binary = "^2.9.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
black = "^23.10.0"
mypy = "^1.7.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
